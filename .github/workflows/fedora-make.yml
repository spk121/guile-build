name: Fedora Build

on:
  schedule:
    - cron: '0 18 * * *'  # Daily at 18:00 UTC
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to build from'
        required: true
        default: 'https://codeberg.org/guile/guile.git'
        type: choice
        options:
          - 'https://codeberg.org/guile/guile.git'
          - 'https://github.com/spk121/guile.git'
      ref:
        description: 'Branch, tag, or commit SHA (leave blank for default branch)'
        required: false
        default: ''
        type: string

jobs:
  build:
    name: Build and Install
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - name: Install packages
      run: >-
        dnf install -y
        git
        gcc
        gcc-c++
        make
        autoconf
        automake
        libtool
        gettext-devel
        gperf
        pkgconf-pkg-config
        lzip
        xz
        flex
        bison
        m4
        gc-devel
        gmp-devel
        libffi-devel
        libunistring-devel
        readline-devel
        ncurses-devel
        texinfo
        coreutils
        sed
        gdb
        elfutils

    - name: Clone source repository
      env:
        REPO_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || 'https://codeberg.org/guile/guile.git' }}
        REPO_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
      run: |
        git clone "$REPO_URL" --depth=1
        if [ -n "$REPO_REF" ]; then
          cd guile
          git fetch --depth=1 origin "$REPO_REF"
          git checkout "$REPO_REF"
        fi
      shell: bash

    - name: Prepare install prefix
      run: |
        mkdir -p /app
      shell: bash

    - name: Configure
      run: |
        set -o pipefail
        export LANG=C.UTF-8 TERM=dumb VERBOSE=true TZ=America/Los_Angeles
        cd guile
        ./autogen.sh 2>&1 | tee configure.log
        ./configure \
          CFLAGS="-g -O2 -Wall" \
          LDFLAGS="-Wl,-rpath,/app/lib" \
          --prefix=/app \
          2>&1 | tee -a configure.log
      shell: bash

    - name: Upload Configure Log
      if: success() || failure()
      uses: actions/upload-artifact@v6
      with:
        name: configure-log
        path: |
          guile/configure.log
          guile/config.log
        if-no-files-found: ignore

    - name: Configure Core Dump Capture
      run: |
        set -o pipefail
        workspace_dir="${GITHUB_WORKSPACE:-$(pwd)}"
        core_diag_dir="$workspace_dir/guile/crash-diagnostics"
        core_dir="$core_diag_dir/cores"
        core_pattern="$core_dir/core.%e.%p.%t"
        setup_log="$core_diag_dir/core-capture-setup.log"
        mkdir -p "$core_dir"

        {
          echo "timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "workspace_dir: $workspace_dir"
          echo "requested_core_pattern: $core_pattern"
          echo "ulimit_before: $(ulimit -c)"
        } > "$setup_log"

        ulimit -c unlimited || true
        echo "ulimit_after: $(ulimit -c)" >> "$setup_log"

        if [ -w /proc/sys/kernel/core_pattern ]; then
          if printf '%s\n' "$core_pattern" > /proc/sys/kernel/core_pattern 2>>"$setup_log"; then
            echo "core_pattern_override: success" >> "$setup_log"
          else
            echo "core_pattern_override: failed" >> "$setup_log"
          fi
        else
          echo "core_pattern_override: skipped (not writable)" >> "$setup_log"
        fi

        echo "kernel.core_pattern: $(cat /proc/sys/kernel/core_pattern 2>/dev/null || echo unavailable)" >> "$setup_log"
        echo "kernel.core_uses_pid: $(cat /proc/sys/kernel/core_uses_pid 2>/dev/null || echo unavailable)" >> "$setup_log"
      shell: bash

    - name: Build
      run: |
        set -o pipefail
        ulimit -c unlimited
        cd guile
        make -j"$(nproc)" V=1 2>&1 | tee build.log
      shell: bash

    - name: Upload Build Log
      if: success() || failure()
      uses: actions/upload-artifact@v6
      with:
        name: build-log
        path: guile/build.log
        if-no-files-found: ignore

    - name: Install
      run: |
        set -o pipefail
        ulimit -c unlimited
        cd guile
        make install V=1 2>&1 | tee install.log
      shell: bash

    - name: Collect Crash Diagnostics
      if: failure()
      run: |
        set -o pipefail
        diag_dir="$(pwd)/guile/crash-diagnostics"
        mkdir -p "$diag_dir"

        {
          echo "timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "uname: $(uname -a)"
          echo "ulimit_core: $(ulimit -c)"
          echo "kernel.core_pattern: $(cat /proc/sys/kernel/core_pattern 2>/dev/null || echo unavailable)"
          echo "kernel.core_uses_pid: $(cat /proc/sys/kernel/core_uses_pid 2>/dev/null || echo unavailable)"
        } > "$diag_dir/system.txt"

        dmesg > "$diag_dir/dmesg.log" 2>&1 || true

        if command -v coredumpctl >/dev/null 2>&1; then
          coredumpctl list --no-pager > "$diag_dir/coredumpctl-list.log" 2>&1 || true
          coredumpctl info --no-pager > "$diag_dir/coredumpctl-info.log" 2>&1 || true
        else
          echo "coredumpctl not available" > "$diag_dir/coredumpctl-unavailable.log"
        fi

        if [ -f guile/build.log ]; then
          grep -nE 'Segmentation fault|SIGSEGV|core dumped|Aborted' guile/build.log > "$diag_dir/build-crash-lines.log" || true
        fi
        if [ -f guile/install.log ]; then
          grep -nE 'Segmentation fault|SIGSEGV|core dumped|Aborted' guile/install.log > "$diag_dir/install-crash-lines.log" || true
        fi

        mapfile -d '' core_files < <(find "$(pwd)" -type f \( -name 'core' -o -name 'core.*' -o -name '*.core' \) -print0 2>/dev/null)
        if [ "${#core_files[@]}" -eq 0 ]; then
          echo "No core files found under workspace." > "$diag_dir/no-core-files.log"
          if [ -f "$diag_dir/core-capture-setup.log" ]; then
            echo "Core capture setup log is available at crash-diagnostics/core-capture-setup.log." >> "$diag_dir/no-core-files.log"
          fi
          exit 0
        fi

        printf '%s\n' "${core_files[@]}" > "$diag_dir/core-files.txt"
        for core in "${core_files[@]}"; do
          core_base="$(basename "$core")"
          file "$core" > "$diag_dir/${core_base}.file.log" 2>&1 || true
          exe_path="$(file "$core" | sed -n "s/.*from '\\(.*\\)'.*/\\1/p")"

          if [ -n "$exe_path" ] && [ -x "$exe_path" ]; then
            gdb --batch --quiet "$exe_path" "$core" \
              -ex 'set pagination off' \
              -ex 'thread apply all bt full' \
              > "$diag_dir/${core_base}.gdb.log" 2>&1 || true
          else
            gdb --batch --quiet -c "$core" \
              -ex 'set pagination off' \
              -ex 'thread apply all bt full' \
              > "$diag_dir/${core_base}.gdb.log" 2>&1 || true
          fi
        done
      shell: bash

    - name: Upload Crash Diagnostics
      if: success() || failure()
      uses: actions/upload-artifact@v6
      with:
        name: crash-diagnostics
        path: guile/crash-diagnostics
        if-no-files-found: ignore

    - name: Upload Install Log
      if: success() || failure()
      uses: actions/upload-artifact@v6
      with:
        name: install-log
        path: guile/install.log
        if-no-files-found: ignore

    - name: Verify Installation
      env:
        PATH: /app/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        LD_LIBRARY_PATH: /app/lib
      run: |
        ls -la /app/bin/
        ls -la /app/lib/
        echo "--- guile --version ---"
        guile --version
        echo "--- guile-config info ---"
        guile-config info || true
  
        echo "--- evaluate (display (+ 1 2)) ---"
        guile -c '(display (+ 1 2)) (newline)'
      shell: bash
